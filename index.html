<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>片葉 — 古典籍IIIFリーダー</title><style>*{box-sizing:border-box}body{margin:0;background:#eeeae1;color:#29382f;font:15px system-ui}header{padding:14px 22px;background:#faf8f2;border-bottom:1px solid #ccc8bb;display:flex;align-items:center;gap:16px}h1{font:28px serif;margin:0}small{color:#777}button,select,input{font:inherit;border:1px solid #cbc9bf;border-radius:7px;padding:11px;background:#fff;color:inherit}button{cursor:pointer}button:disabled{opacity:.4}button.primary{background:#294b3c;color:white}form{display:flex;gap:8px;padding:12px 20px}input[type=url]{flex:1;min-width:0}#stage{height:calc(100dvh - 240px);min-height:240px;position:relative;background:#d8d5cc}#viewer{height:100%;width:100%}#empty{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}#empty h2{font:32px serif}#tools,footer{display:flex;gap:8px;align-items:center;justify-content:center;padding:10px;flex-wrap:wrap}#status{text-align:center;font-size:13px;min-height:22px;padding:3px}#edit{background:#faf8f2;padding:12px 20px;display:none}#edit label{display:inline-flex;align-items:center;gap:8px}input[type=range]{width:180px}#mini{max-width:100%;max-height:240px;touch-action:none;display:block;margin:auto}body.editing #edit{display:block}body.editing #stage{height:40dvh}#title{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}a{color:inherit}@media(max-width:600px){header{padding:10px}header small{display:none}form{padding:8px}button,select{padding:10px}#stage{height:calc(100dvh - 290px)}#title{max-width:40vw}}</style>
<header><h1>片葉</h1><small>古典籍 IIIF リーダー</small><span id="title"></span><button id="demo">試し読み</button></header>
<form id="load"><input id="url" type="url" required placeholder="IIIF Manifest URL" aria-label="Manifest URL"><button class="primary">開く</button></form>
<div id="stage"><div id="viewer"></div><div id="empty"><h2>見開きを、一面ずつ。</h2><p>Manifest URLを入力して読み始める<br>ピンチで拡大・標準倍率でスワイプしてページ送り</p></div></div>
<div id="edit"><canvas id="mini" width="700" height="350"></canvas><label>上端 <input id="top" type="range" min="20" max="80" step="0.1"></label><label>下端 <input id="bottom" type="range" min="20" max="80" step="0.1"></label><button id="auto">再検出</button><small>色付きの帯は左右両面に重複表示します。線の上端・下端をドラッグして調整できます</small></div>
<div id="tools"><button id="mode">見開きにする</button><button id="adjust">綴じ目を調整</button><label><input id="single" type="checkbox">この画像は分割しない</label><select id="direction" aria-label="読む順序"><option value="rtl">右面 → 左面</option><option value="ltr">左面 → 右面</option></select><button id="home">全体を収める</button></div>
<footer><button id="prev">前へ</button><select id="pages" aria-label="画像を選択"></select><span id="side"></span><button id="next" class="primary">次へ</button></footer><div id="status" role="status" aria-live="polite">画像は配信元から直接読み込みます。</div>
<script src="osd.js"></script><script src="app.js?v=2"></script></html>
